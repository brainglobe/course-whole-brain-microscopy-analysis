project:
  output-dir: build
  render:
    - index.qmd
  # Executed code cells read relative to the project root.
  pre-render: ln -sfn irv-helga/resources resources
  # Quarto only copies assets it finds under this project, so top up build/img with
  # the submodule's. -n because the ~10 shared filenames are byte-identical anyway.
  post-render: cp -r irv-helga/img/. build/img/ --update=none

execute:
  enabled: true

format:
    revealjs:
        theme: [bg-light.scss]
        logo: img/BG_logo.png
        footer: "[https://brainglobe.info/course-whole-brain-microscopy-analysis](https://brainglobe.info/course-whole-brain-microscopy-analysis) | 2025-11-10"
        slide-number: c
        menu:
          numbers: true
          useTextContentForMissingTitles: false 
          hideMissingTitles: true
        chalkboard: true
        scrollable: false
        preview-links: false
        view-distance: 10
        mobile-view-distance: 10
        auto-animate: true
        auto-play-media: false
        code-overflow: wrap
        highlight-style: atom-one
        mermaid: 
          theme: neutral
          fontFamily: arial
          curve: linear
          